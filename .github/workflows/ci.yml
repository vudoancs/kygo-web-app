name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lockfiles are not committed in this repo, so npm ci cannot be used.
      - run: npm install --ignore-scripts --no-audit --no-fund

      # Fails only when errors/warnings exceed .eslint-baseline.json
      - run: npm run lint:ci
